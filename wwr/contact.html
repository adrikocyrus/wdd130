<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Learn about Splash Water Rafting Adventures, our history, mission, and exciting white water rafting experiences.">
    <meta name="author" content="Adriko Cyrus">
    <title>About us | Splash Water Rafting Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="White Water Rafting Site Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>Splash Water Rafting Adventure</h1>
            <p>15 Wampewo Avenue</p>
            <p>Kololo, Kampala, Uganda</p>
            <p>+256 700 123 456</p>
            <p>adrikocyrus@gmail.com</p>
        </section>

        <section class="contact-container">

            <div class="map">
                <iframe
                  src="https://maps.google.com/maps?q=Kololo%20Kampala%20Uganda&t=&z=15&ie=UTF8&iwloc=&output=embed"
                  loading="lazy" allowfullscreen>
                </iframe>
            </div>

            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>

                    <div class="form-group purpose">
                        <p>Message Purpose</p>

                        <label>
                            <input type="radio" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Type here"></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter">
                        Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>

        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="../images/profile.png" alt="Operations Manager">
                <figcaption>Adriko Cyrus - Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/guide.jpg" alt="Lead River Guide">
                <figcaption>Sarah Wakoli - Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/support.jpg" alt="Customer Support Specialist">
                <figcaption>Kasolo Moses - Customer Support Specialist</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>
            &COPY; 2026 | Splash Water Rafting Adventures | Adriko Cyrus
        </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.jpg" alt="twitter">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.jpg" alt="instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
