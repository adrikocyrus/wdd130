<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poll form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <header>
        <h1>Contact information</h1>
    </header>

    <main>
        <form action="#" method="post">
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>

            <br><br>

            <div class="column1">
                <label for="browser">What is your favorite browser?</label>
                <select id="browser" name="browser" required>
                    <option value="">-- Please choose an option --</option>
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <br><br>
            <div class="column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <br><br>

            <label for="feedback">List the places you have lived.</label><br>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Enter the places you have lived here..."></textarea>

            <br><br>

            <button type="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 |HTML Form - User poll activity | ADRIKO CYRUS</p>
    </footer>

</body>

</html>
